name: Build Signed Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.jks

      - name: Build signed APK and AAB
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle clean assembleRelease bundleRelease

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
             "Reels-Blocker-${GITHUB_REF_NAME}.apk"

          cp app/build/outputs/bundle/release/app-release.aab \
             "Reels-Blocker-${GITHUB_REF_NAME}.aab"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Reels-Blocker-${{ github.ref_name }}
          path: |
            Reels-Blocker-${{ github.ref_name }}.apk
            Reels-Blocker-${{ github.ref_name }}.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reels Blocker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Reels-Blocker-${{ github.ref_name }}.apk
            Reels-Blocker-${{ github.ref_name }}.aab

      - name: Remove temporary keystore
        if: always()
        run: rm -f app/release.jks
