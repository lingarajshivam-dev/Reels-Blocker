plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.invisibleblocker'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.invisibleblocker'
        minSdk 26
        targetSdk 35

        versionCode 5
        versionName '2.3'
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
